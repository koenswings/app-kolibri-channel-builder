x-app:
  name: kolibri-channel-builder
  title: Kolibri Channel Builder
  description: >
    Turn a teacher's folders (from a Files Disk or Nextcloud) into a Kolibri
    channel, offline. Folder = topic, file = resource (PDF, EPUB, MP4/WebM,
    MP3, images). Kolibri imports the channel from this app over the local
    network when a teacher or admin clicks Import in Kolibri.
  url: https://github.com/koenswings/app-kolibri-channel-builder
  category: education
  icon: icon.png
  author: Koen Swings
  version: TBD-commit-sha
  instanceName: kolibri-channel-builder
  filesMount:
    path: /mnt/idea-files
    services: [builder]
  # idea#193: the Engine binds host /run/idea-usb here read-only (rslave), plus
  # .idea-usb.json; sticks plugged in later appear without a recreate.
  usbMount:
    path: /mnt/idea-usb
    services: [builder]
services:
  builder:
    image: ghcr.io/koenswings/kolibri-channel-builder:1.0-0.15.5@sha256:7314f99fb32549f1b0ee27b8539f1f1e9ba9721a620c7ac61034c5832fa17779
    restart: no
    pull_policy: missing
    init: true
    mem_limit: 300m
    # Same probe as the image's HEALTHCHECK, stated in compose so the Engine/Console see it
    # without inspecting the image. Container port is fixed (8090).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    ports:
      - ${port}:8090
    volumes:
      # Built channels (KOLIBRI_DATA/content/...) travel with the App Disk.
      - ./data/export:/data/export
      - ./data/work:/data/work
    environment:
      - EXPORT_DIR=/data/export
      - WORK_DIR=/data/work
      - FILES_ROOT=/mnt/idea-files
      - USB_ROOT=/mnt/idea-usb
      # Auto-build sticks with a top-level kolibri/ folder (1/0) and the per-stick cap.
      - AUTO_BUILD=1
      - AUTO_BUILD_MAX_GB=8
      # Default channel language when a stick's channel.json has no valid "language".
      - CHANNEL_LANGUAGE=en
      # Optional: Nextcloud on this Pi. Use an IP, not a .local name (.local does not
      # resolve inside containers). A login is asked only for the Nextcloud source.
      - NEXTCLOUD_URL=
      # Optional: this Pi's LAN IP, shown as the address to add in Kolibri.
      - LAN_IP=
      # Published host port (the Engine's ${port}), shown in the Kolibri address
      # instead of the container port 8090.
      - PUBLIC_PORT=${port}
      # Pi hostname for the Kolibri peer device_name. The Engine currently only
      # sets ${hostname} for nextcloud; until it writes it for every app, this
      # expands to empty and the server falls back to plain "Channel builder".
      - IDEA_PI_HOSTNAME=${hostname:-}
