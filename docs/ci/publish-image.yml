# PROPOSED replacement for .github/workflows/publish-image.yml (the agent token lacks the `workflow` scope; copy it over by hand).
# Copy to .github/workflows/publish-image.yml (needs a token with the `workflow` scope).
# Publishes ghcr.io/koenswings/kolibri-channel-builder for amd64 + arm64 on a tag push; existing tags are never overwritten.
name: publish-image
on:
  push:
    tags: ["*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      # Never overwrite a tag that already exists in ghcr (idea#322): only new tags and `main` are pushed.
      - id: tags
        run: |
          {
            echo 'list<<EOF'
            script/publish-tags.sh ghcr.io/koenswings/kolibri-channel-builder 1.0-0.15.5 "${{ github.ref_name }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - if: steps.tags.outputs.list == ''
        run: echo "Every tag already exists in ghcr; nothing pushed."
      - if: steps.tags.outputs.list != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
