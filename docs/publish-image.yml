# Copy to .github/workflows/publish-image.yml (needs a token with the `workflow` scope).
# Publishes ghcr.io/koenswings/kolibri-channel-builder:<tag> for amd64 + arm64 on a tag push.
name: publish-image
on:
  push:
    tags: ["*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/koenswings/kolibri-channel-builder:1.0-0.15.5
            ghcr.io/koenswings/kolibri-channel-builder:${{ github.ref_name }}
